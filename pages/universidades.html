<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Universidades del Área Metropolitana - Lista completa de universidades públicas y privadas en Antioquia">
  <title>Universidades - DUAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="https://josecopro.github.io/DUAM/GPT_Lo_Hace/DUAM_LOGO.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div data-header></div>

  <main role="main">
    <section class="university-list" aria-labelledby="universities-title">
      <header class="university-list__header">
        <h1 id="universities-title" class="university-list__title">Universidades del Área Metropolitana</h1>
        <p class="university-list__subtitle">21 universidades acreditadas de alta calidad en Antioquia</p>
      </header>

      <section class="university-list__section" aria-labelledby="private-title">
        <h2 id="private-title" class="university-list__section-title">Privadas</h2>
        <div class="university-list__grid" id="private-universities" role="list">
        </div>
      </section>

      <section class="university-list__section" aria-labelledby="public-title">
        <h2 id="public-title" class="university-list__section-title">Oficiales</h2>
        <div class="university-list__grid" id="public-universities" role="list">
        </div>
      </section>
    </section>
  </main>

  <div data-footer></div>

  <div class="help-button" role="region" aria-label="Ayuda y PQRS">
    <button class="help-button__trigger" aria-label="Abrir formulario de ayuda" aria-expanded="false">
      <svg class="icon icon--lg" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>

    <div class="help-button__panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-button__header">
        <h3 id="help-title" class="help-button__title">Ayuda y PQRS</h3>
        <button class="help-button__close" aria-label="Cerrar">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="help-button__form">
        <form class="form-grid" novalidate>
          <div class="form-field">
            <label class="form-field__label" for="pqrs-name">Nombre completo *</label>
            <input type="text" id="pqrs-name" name="nombre" class="form-field__input" required placeholder="Tu nombre completo">
          </div>
          <div class="form-field">
            <label class="form-field__label" for="pqrs-email">Correo electrónico *</label>
            <input type="email" id="pqrs-email" name="correo" class="form-field__input" required placeholder="tu@correo.com">
          </div>
          <div class="form-field form-field--full">
            <label class="form-field__label" for="pqrs-message">Mensaje *</label>
            <textarea id="pqrs-message" name="comentario" class="form-field__input" rows="5" required placeholder="Escribe tu consulta, queja, reclamo o sugerencia..."></textarea>
          </div>
          <button type="submit" class="button button--primary button--lg button--full">Enviar PQRS</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { universities } from '../data/universities.js';

    function renderUniversities() {
      const privateContainer = document.getElementById('private-universities');
      const publicContainer = document.getElementById('public-universities');

      if (privateContainer) {
        privateContainer.innerHTML = universities.private.map(uni => `
          <a href="${uni.url}" target="_blank" rel="noopener noreferrer" class="university-list__item" role="listitem">
            ${uni.name}
          </a>
        `).join('');
      }

      if (publicContainer) {
        publicContainer.innerHTML = universities.public.map(uni => `
          <a href="${uni.url}" target="_blank" rel="noopener noreferrer" class="university-list__item university-list__item--public" role="listitem">
            ${uni.name}
          </a>
        `).join('');
      }
    }

    document.addEventListener('DOMContentLoaded', renderUniversities);
  </script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
