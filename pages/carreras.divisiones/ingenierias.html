<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ingenierías - Programas de ingeniería en el Área Metropolitana. Ingeniería de Sistemas, Civil, Electrónica, Industrial, Mecánica y más.">
  <title>Ingenierías - DUAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="https://josecopro.github.io/DUAM/GPT_Lo_Hace/DUAM_LOGO.svg">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
  <div data-header></div>

  <main role="main">
    <section class="section" aria-labelledby="career-title">
      <div class="container">
        <header class="text-center mb-12 max-w-3xl mx-auto animate-fade-in">
          <div class="inline-flex items-center justify-center w-16 h-16 mb-4 rounded-full" style="background: rgba(30, 58, 95, 0.1); color: var(--color-primary);">
            <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          </div>
          <h1 id="career-title" class="text-4xl font-bold mb-3">Ingenierías</h1>
          <p class="text-lg text-muted leading-relaxed">Programas de ingeniería en diversas especialidades. Formación técnica de alto nivel para resolver problemas complejos.</p>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto" id="subcareers-grid" role="list">
        </div>

        <div class="text-center mt-12 animate-fade-in">
          <a href="../carreras.html" class="button button--ghost">
            <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Volver a todas las carreras
          </a>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <div class="help-button" role="region" aria-label="Ayuda y PQRS">
    <button class="help-button__trigger" aria-label="Abrir formulario de ayuda" aria-expanded="false">
      <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
    <div class="help-button__panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-button__header">
        <h3 id="help-title" class="help-button__title">Ayuda y PQRS</h3>
        <button class="help-button__close" aria-label="Cerrar">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="help-button__form">
        <form class="form-grid" novalidate>
          <div class="form-field"><label class="form-field__label" for="pqrs-name">Nombre completo *</label><input type="text" id="pqrs-name" name="nombre" class="form-field__input" required placeholder="Tu nombre completo"></div>
          <div class="form-field"><label class="form-field__label" for="pqrs-email">Correo electrónico *</label><input type="email" id="pqrs-email" name="correo" class="form-field__input" required placeholder="tu@correo.com"></div>
          <div class="form-field form-field--full"><label class="form-field__label" for="pqrs-message">Mensaje *</label><textarea id="pqrs-message" name="comentario" class="form-field__input" rows="5" required placeholder="Escribe tu consulta, queja, reclamo o sugerencia..."></textarea></div>
          <button type="submit" class="button button--primary button--lg button--full">Enviar PQRS</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    const subcareers = [
      { name: "Ingeniería de Sistemas", description: "Desarrollo de software, arquitectura de sistemas, bases de datos y seguridad informática.", universities: ["EAFIT", "UdeA", "UPB", "EIA", "UNAL", "ITM"] },
      { name: "Ingeniería Civil", description: "Diseño, construcción y mantenimiento de infraestructura: puentes, edificios, vías y obras hidráulicas.", universities: ["UNAL", "UdeA", "UPB", "EIA", "EAFIT", "ITM"] },
      { name: "Ingeniería Electrónica", description: "Sistemas electrónicos, telecomunicaciones, automatización y procesamiento de señales.", universities: ["EAFIT", "UPB", "EIA", "UNAL", "ITM"] },
      { name: "Ingeniería Industrial", description: "Optimización de procesos, logística, calidad, gestión de operaciones y productividad.", universities: ["EAFIT", "UdeA", "UPB", "UNAL", "EIA", "ITM"] },
      { name: "Ingeniería Mecánica", description: "Diseño de máquinas, termodinámica, materiales, manufactura y sistemas mecánicos.", universities: ["UNAL", "UdeA", "UPB", "EIA", "ITM"] },
      { name: "Ingeniería Química", description: "Procesos químicos, petroquímica, biotecnología, medio ambiente y energía.", universities: ["UNAL", "UdeA", "EAFIT", "UPB"] },
      { name: "Ingeniería Ambiental", description: "Gestión ambiental, tratamiento de aguas, residuos, calidad del aire y sostenibilidad.", universities: ["UNAL", "UdeA", "EAFIT", "UPB", "ITM"] },
      { name: "Ingeniería de Telecomunicaciones", description: "Redes, comunicaciones móviles, fibra óptica, satélites y sistemas de transmisión.", universities: ["EAFIT", "UPB", "UNAL", "ITM"] }
    ];

    function renderSubcareers() {
      const grid = document.getElementById('subcareers-grid');
      if (!grid) return;

      grid.innerHTML = subcareers.map((sub, index) => `
        <article class="card animate-slide-up" role="listitem" style="animation-delay: ${index * 80}ms;">
          <div class="card__content">
            <h3 class="card__title">${sub.name}</h3>
            <p class="card__description">${sub.description}</p>
            <div class="card__footer">
              <span class="tag tag--primary">${sub.universities.length} universidades</span>
            </div>
            <div class="flex flex-wrap gap-2 mt-3">
              ${sub.universities.map(u => `<span class="tag tag--outline tag--sm">${u}</span>`).join('')}
            </div>
          </div>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderSubcareers);
  </script>
  <script type="module" src="../../assets/js/main.js"></script>
</body>
</html>
