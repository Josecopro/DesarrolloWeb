<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Salud - Programas en el Área Metropolitana de Antioquia.">
  <title>Salud - DUAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="../../assets/images/DUAM_LOGO_blanco.svg">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
  <div data-header></div>

  <main role="main">
    <section class="section" aria-labelledby="career-title">
      <div class="container">
        <header class="section__header section__header--centered animate-fade-in">
          <div class="career-header__icon career-header__icon--primary" style="background: rgba(39, 174, 96, 0.1); color: var(--color-success);">
            <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          </div>
          <h1 id="career-title" class="section__title">Salud</h1>
          <p class="section__subtitle">Carreras del área de la salud y ciencias médicas. Formación para el cuidado y bienestar de las personas.</p>
        </header>

        <div class="subcareers-grid" id="subcareers-grid" role="list">
        </div>

        <div class="section__back-link animate-fade-in">
          <a href="../carreras.html" class="button button--ghost">
            <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Volver a todas las carreras
          </a>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <div class="help-button" role="region" aria-label="Ayuda y PQRS">
    <button class="help-button__trigger" aria-label="Abrir formulario de ayuda" aria-expanded="false">
      <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
    <div class="help-button__panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-button__header">
        <h3 id="help-title" class="help-button__title">Ayuda y PQRS</h3>
        <button class="help-button__close" aria-label="Cerrar">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="help-button__form">
        <form class="form-grid" novalidate>
          <div class="form-field"><label class="form-field__label" for="pqrs-name">Nombre completo *</label><input type="text" id="pqrs-name" name="nombre" class="form-field__input" required placeholder="Tu nombre completo"></div>
          <div class="form-field"><label class="form-field__label" for="pqrs-email">Correo electrónico *</label><input type="email" id="pqrs-email" name="correo" class="form-field__input" required placeholder="tu@correo.com"></div>
          <div class="form-field form-field--full"><label class="form-field__label" for="pqrs-message">Mensaje *</label><textarea id="pqrs-message" name="comentario" class="form-field__input" rows="5" required placeholder="Escribe tu consulta, queja, reclamo o sugerencia..."></textarea></div>
          <button type="submit" class="button button--primary button--lg button--full">Enviar PQRS</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    // Subcareer data will be loaded from careers.js
    import { careers } from '../../../data/careers.js';

    function renderSubcareers() {
      const grid = document.getElementById('subcareers-grid');
      if (!grid) return;

      const category = careers.categories.find(c => c.id === 'salud');
      if (!category) return;

      grid.innerHTML = category.subcategories.map((sub, index) => `
        <article class="card card--subcareer animate-slide-up" role="listitem" style="animation-delay: ${index * 80}ms;">
          <div class="card__content">
            <h3 class="card__title">${sub}</h3>
            <div class="card__footer">
              <span class="tag tag--primary">${category.universities?.length || 0} universidades</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderSubcareers);
  </script>
  <script type="module" src="../../assets/js/main.js"></script>
</body>
</html>
