<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ciencias Sociales y Derecho - Derecho, ciencias políticas y sociales en el Área Metropolitana. Derecho, Ciencia Política, Sociología y más.">
  <title>Ciencias Sociales y Derecho - DUAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="https://josecopro.github.io/DUAM/GPT_Lo_Hace/DUAM_LOGO.svg">
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
  <div data-header></div>

  <main role="main">
    <section class="section" aria-labelledby="career-title">
      <div class="container">
        <header class="text-center mb-12 max-w-3xl mx-auto animate-fade-in">
          <div class="inline-flex items-center justify-center w-16 h-16 mb-4 rounded-full" style="background: rgba(192, 57, 43, 0.1); color: var(--color-accent);">
            <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </div>
          <h1 id="career-title" class="text-4xl font-bold mb-3">Ciencias Sociales y Derecho</h1>
          <p class="text-lg text-muted leading-relaxed">Derecho, ciencias políticas y sociales. Formación para la justicia, la gestión pública y el análisis social.</p>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto" id="subcareers-grid" role="list">
        </div>

        <div class="text-center mt-12 animate-fade-in">
          <a href="../carreras.html" class="button button--ghost">
            <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Volver a todas las carreras
          </a>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <div class="help-button" role="region" aria-label="Ayuda y PQRS">
    <button class="help-button__trigger" aria-label="Abrir formulario de ayuda" aria-expanded="false">
      <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
    <div class="help-button__panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-button__header">
        <h3 id="help-title" class="help-button__title">Ayuda y PQRS</h3>
        <button class="help-button__close" aria-label="Cerrar">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="help-button__form">
        <form class="form-grid" novalidate>
          <div class="form-field"><label class="form-field__label" for="pqrs-name">Nombre completo *</label><input type="text" id="pqrs-name" name="nombre" class="form-field__input" required placeholder="Tu nombre completo"></div>
          <div class="form-field"><label class="form-field__label" for="pqrs-email">Correo electrónico *</label><input type="email" id="pqrs-email" name="correo" class="form-field__input" required placeholder="tu@correo.com"></div>
          <div class="form-field form-field--full"><label class="form-field__label" for="pqrs-message">Mensaje *</label><textarea id="pqrs-message" name="comentario" class="form-field__input" rows="5" required placeholder="Escribe tu consulta, queja, reclamo o sugerencia..."></textarea></div>
          <button type="submit" class="button button--primary button--lg button--full">Enviar PQRS</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    const subcareers = [
      { name: "Derecho", description: "Derecho constitucional, penal, civil, laboral, comercial, internacional y administrativo.", universities: ["UNAL", "UdeA", "UPB", "EAFIT", "ITM", "CES"] },
      { name: "Ciencia Política", description: "Teoría política, sistemas políticos, relaciones internacionales, gestión pública y democracia.", universities: ["UNAL", "UdeA", "UPB", "EAFIT"] },
      { name: "Sociología", description: "Estructura social, desigualdad, movimientos sociales, metodología de investigación.", universities: ["UNAL", "UdeA", "UPB"] },
      { name: "Antropología", description: "Culturas, arqueología, antropología física, lingüística y etnográfica.", universities: ["UNAL", "UdeA"] },
      { name: "Economía", description: "Microeconomía, macroeconomía, econometría, economía del desarrollo y finanzas públicas.", universities: ["UNAL", "UdeA", "EAFIT", "UPB"] },
      { name: "Administración Pública", description: "Gestión estatal, políticas públicas, derecho administrativo, control fiscal y modernización.", universities: ["UNAL", "UdeA", "UPB", "ITM"] },
      { name: "Relaciones Internacionales", description: "Diplomacia, organismos internacionales, comercio exterior, cooperación y conflictos.", universities: ["UNAL", "UPB", "EAFIT", "UdeA"] },
      { name: "Trabajo Social", description: "Intervención social, políticas de bienestar, comunidades, familia y derechos humanos.", universities: ["UNAL", "UdeA", "UPB", "ITM"] }
    ];

    function renderSubcareers() {
      const grid = document.getElementById('subcareers-grid');
      if (!grid) return;

      grid.innerHTML = subcareers.map((sub, index) => `
        <article class="card animate-slide-up" role="listitem" style="animation-delay: ${index * 80}ms;">
          <div class="card__content">
            <h3 class="card__title">${sub.name}</h3>
            <p class="card__description">${sub.description}</p>
            <div class="card__footer">
              <span class="tag tag--outline">${sub.universities.length} universidades</span>
            </div>
            <div class="flex flex-wrap gap-2 mt-3">
              ${sub.universities.map(u => `<span class="tag tag--outline tag--sm">${u}</span>`).join('')}
            </div>
          </div>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderSubcareers);
  </script>
  <script type="module" src="../../assets/js/main.js"></script>
</body>
</html>
