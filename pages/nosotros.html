<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nosotros - Equipo DUAM. Conoce a los creadores del Directorio Universitario del Área Metropolitana.">
  <title>Nosotros - DUAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="../assets/images/DUAM_LOGO_blanco.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div data-header></div>

  <main role="main">
    <section class="section" aria-labelledby="team-title">
      <div class="container">
        <header class="section__header section__header--centered animate-fade-in">
          <h1 id="team-title" class="section__title">Creadores de DUAM</h1>
          <p class="section__subtitle">Un equipo multidisciplinario apasionado por la educación y la tecnología</p>
        </header>

        <figure class="team-figure animate-slide-up">
          <div class="card card--featured">
            <div class="card__content card__content--centered">
              <img src="../assets/images/BkKBrwC.jpg" alt="Equipo DUAM completo" class="card__image team-image" loading="lazy">
              <figcaption class="card__caption">Equipo DUAM - Comprometidos con tu futuro educativo</figcaption>
            </div>
          </div>
        </figure>

        <div class="team-grid" id="team-grid" role="list">
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <div class="help-button" role="region" aria-label="Ayuda y PQRS">
    <button class="help-button__trigger" aria-label="Abrir formulario de ayuda" aria-expanded="false">
      <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>

    <div class="help-button__panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-button__header">
        <h3 id="help-title" class="help-button__title">Ayuda y PQRS</h3>
        <button class="help-button__close" aria-label="Cerrar">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="help-button__form">
        <form class="form-grid" novalidate>
          <div class="form-field"><label class="form-field__label" for="pqrs-name">Nombre completo *</label><input type="text" id="pqrs-name" name="nombre" class="form-field__input" required placeholder="Tu nombre completo"></div>
          <div class="form-field"><label class="form-field__label" for="pqrs-email">Correo electrónico *</label><input type="email" id="pqrs-email" name="correo" class="form-field__input" required placeholder="tu@correo.com"></div>
          <div class="form-field form-field--full"><label class="form-field__label" for="pqrs-message">Mensaje *</label><textarea id="pqrs-message" name="comentario" class="form-field__input" rows="5" required placeholder="Escribe tu consulta, queja, reclamo o sugerencia..."></textarea></div>
          <button type="submit" class="button button--primary button--lg button--full">Enviar PQRS</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    const team = [
      {
        name: "Yesid Maldonado",
        role: "Documentador Técnico",
        image: "../assets/images/ghcD5Ud.jpg",
        bio: "Tengo pasión por muchas cosas, el fútbol, la programación, el cine y las peladas con gafas. Confío en que DUAM va a ayudar a un par de estudiantes a informarse para su educación superior.",
        icon: "📝"
      },
      {
        name: "Karina Silva",
        role: "DB Developer",
        image: "../assets/images/sIh8074.jpg",
        bio: "Confío en que el responsive va a funcionar a la primera porque dios es grande amén. Apasionada por las bases de datos y la arquitectura de información.",
        icon: "💾"
      },
      {
        name: "Julian Oviedo",
        role: "Backend Developer",
        image: "../assets/images/5tFMcsi.jpg",
        bio: "Yo le rece al dios del responsive para que esta página se pueda ver en un iPhone SE. Creanme que lo último que quiero hacer es el responsive. Backend developer de corazón.",
        icon: "⚙️"
      },
      {
        name: "Juan José Becerra",
        role: "UI/UX Designer & Frontend",
        image: "../assets/images/5tFMcsi.jpg",
        bio: "Diseñador de interfaces y desarrollador frontend. Apasionado por crear experiencias de usuario intuitivas y accesibles para todos los estudiantes.",
        icon: "🎨"
      }
    ];

    function renderTeam() {
      const grid = document.getElementById('team-grid');
      if (!grid) return;

      grid.innerHTML = team.map((member, index) => `
        <article class="card card--team animate-slide-up" role="listitem" style="animation-delay: ${index * 120}ms;">
          <div class="card__content card__content--centered">
            <div class="team-member__icon">${member.icon}</div>
            <img src="${member.image}" alt="${member.name}" class="card__image team-member__image" loading="lazy">
            <h3 class="card__title">${member.name}</h3>
            <p class="team-member__role">${member.role}</p>
            <p class="card__description">${member.bio}</p>
          </div>
        </article>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', renderTeam);
  </script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
