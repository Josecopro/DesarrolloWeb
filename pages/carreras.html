<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Carreras universitarias por área - Ingenierías, Salud, Humanidades, Educación, Ciencias Básicas, Ciencias Sociales y Servicios">
  <title>Carreras - DUAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="../assets/images/DUAM_LOGO_blanco.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div data-header></div>

  <main role="main">
    <section class="career-grid" aria-labelledby="careers-title">
      <header class="career-grid__header">
        <h1 id="careers-title" class="career-grid__title">Carreras por Área de Estudio</h1>
        <p class="career-grid__subtitle">Explora las 7 áreas principales con más de 50 programas académicos</p>
      </header>

      <div class="career-grid__grid" id="careers-grid" role="list">
      </div>
    </section>

    <section class="section" aria-labelledby="subcareers-title">
      <div class="container">
        <header class="text-center mb-8">
          <h2 id="subcareers-title" class="text-3xl font-bold">Subdivisiones por área</h2>
          <p class="text-muted mt-2">Selecciona un área arriba para ver sus programas específicos</p>
        </header>
        <div id="subcareers-container" class="animate-fade-in">
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <div class="help-button" role="region" aria-label="Ayuda y PQRS">
    <button class="help-button__trigger" aria-label="Abrir formulario de ayuda" aria-expanded="false">
      <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>

    <div class="help-button__panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-button__header">
        <h3 id="help-title" class="help-button__title">Ayuda y PQRS</h3>
        <button class="help-button__close" aria-label="Cerrar">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="help-button__form">
        <form class="form-grid" novalidate>
          <div class="form-field">
            <label class="form-field__label" for="pqrs-name">Nombre completo *</label>
            <input type="text" id="pqrs-name" name="nombre" class="form-field__input" required placeholder="Tu nombre completo">
          </div>
          <div class="form-field">
            <label class="form-field__label" for="pqrs-email">Correo electrónico *</label>
            <input type="email" id="pqrs-email" name="correo" class="form-field__input" required placeholder="tu@correo.com">
          </div>
          <div class="form-field form-field--full">
            <label class="form-field__label" for="pqrs-message">Mensaje *</label>
            <textarea id="pqrs-message" name="comentario" class="form-field__input" rows="5" required placeholder="Escribe tu consulta, queja, reclamo o sugerencia..."></textarea>
          </div>
          <button type="submit" class="button button--primary button--lg button--full">Enviar PQRS</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { careers } from '../data/careers.js';

    function renderCareers() {
      const grid = document.getElementById('careers-grid');
      const subcareersContainer = document.getElementById('subcareers-container');
      const hash = window.location.hash.slice(1);

      if (grid) {
        grid.innerHTML = careers.categories.map((career, index) => `
          <article class="career-grid__card animate-slide-up" role="listitem" style="animation-delay: ${index * 100}ms;">
            <div class="career-grid__image-wrapper">
              <img src="${career.image}" alt="${career.name}" class="career-grid__image" loading="lazy">
              <div class="career-grid__overlay"></div>
            </div>
            <div class="career-grid__content">
              <h3 class="career-grid__name">${career.icon} ${career.name}</h3>
              <p class="career-grid__description">${career.description}</p>
              <div class="career-grid__tags">
                ${career.subcategories.slice(0, 3).map(sub => `<span class="tag tag--primary career-grid__tag">${sub}</span>`).join('')}
                ${career.subcategories.length > 3 ? `<span class="tag tag--outline career-grid__tag">+${career.subcategories.length - 3} más</span>` : ''}
              </div>
              <a href="carreras.html#${career.id}" class="button button--primary career-grid__action mt-4">Ver subdivisiones</a>
            </div>
          </article>
        `).join('');
      }

      if (subcareersContainer) {
        if (hash) {
          const career = careers.categories.find(c => c.id === hash);
          if (career) {
            subcareersContainer.innerHTML = `
              <article class="card animate-slide-up">
                <div class="card__content">
                  <div class="flex items-center gap-3 mb-4">
                    <span class="text-4xl">${career.icon}</span>
                    <h3 class="card__title m-0">${career.name} - Subdivisiones</h3>
                  </div>
                  <p class="card__description mb-6">${career.description}</p>
                  <div class="flex flex-wrap gap-2">
                    ${career.subcategories.map(sub => `
                      <span class="tag tag--primary">${sub}</span>
                    `).join('')}
                  </div>
                </div>
              </article>
            `;
          } else {
            subcareersContainer.innerHTML = `
              <div class="card text-center p-12 animate-fade-in">
                <p class="card__description">Selecciona un área de estudio arriba para ver sus subdivisiones.</p>
              </div>
            `;
          }
        } else {
          subcareersContainer.innerHTML = `
            <div class="card text-center p-12 animate-fade-in">
              <p class="card__description">Selecciona un área de estudio arriba para ver sus subdivisiones.</p>
            </div>
          `;
        }
      }
    }

    function handleHashChange() {
      renderCareers();
      const target = document.querySelector(window.location.hash);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderCareers();
      window.addEventListener('hashchange', handleHashChange);
    });
  </script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
