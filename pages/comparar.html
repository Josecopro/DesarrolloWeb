<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Comparar universidades y carreras - DUAM">
  <title>Comparar - DUAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="../assets/images/DUAM_LOGO_blanco.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
  <div data-header></div>

  <main role="main">
    <section class="section" aria-labelledby="compare-title">
      <div class="container">
        <header class="text-center mb-10 max-w-4xl mx-auto animate-fade-in">
          <h1 id="compare-title" class="text-4xl font-bold mb-3">Comparar opciones</h1>
          <p class="text-lg text-muted leading-relaxed">Analiza lado a lado las universidades y carreras seleccionadas</p>
        </header>

        <div id="compare-container" class="max-w-6xl mx-auto">
          <div class="text-center py-16 animate-fade-in" id="empty-state">
            <div class="inline-flex items-center justify-center w-20 h-20 mb-4 rounded-full" style="background: var(--color-bg-alt); color: var(--color-text-muted);">
              <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M21 9H3"></path><path d="M3 15h18"></path></svg>
            </div>
            <h2 class="text-2xl font-semibold mb-2">No hay elementos para comparar</h2>
            <p class="text-muted mb-6">Selecciona al menos 2 elementos desde las páginas de universidades o carreras</p>
            <div class="flex flex-wrap justify-center gap-4">
              <a href="universidades.html" class="button button--primary">Ver universidades</a>
              <a href="carreras.html" class="button button--secondary">Ver carreras</a>
            </div>
          </div>

          <div id="compare-table" hidden class="animate-fade-in">
            <div class="overflow-x-auto">
              <table class="w-full" role="table">
                <thead>
                  <tr class="bg-alt">
                    <th class="p-4 text-left font-semibold text-primary">Característica</th>
                    <th class="p-4 text-left font-semibold text-primary" id="col-1"></th>
                    <th class="p-4 text-left font-semibold text-primary" id="col-2"></th>
                    <th class="p-4 text-left font-semibold text-primary" id="col-3"></th>
                    <th class="p-4 text-left font-semibold text-primary" id="col-4"></th>
                  </tr>
                </thead>
                <tbody id="compare-rows">
                </tbody>
              </table>
            </div>
            <div class="flex justify-end gap-3 mt-6">
              <button class="button button--ghost" id="clear-compare">Limpiar todo</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-footer></div>

  <div class="help-button" role="region" aria-label="Ayuda y PQRS">
    <button class="help-button__trigger" aria-label="Abrir formulario de ayuda" aria-expanded="false">
      <svg class="icon icon--xl" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </button>
    <div class="help-button__panel" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <div class="help-button__header">
        <h3 id="help-title" class="help-button__title">Ayuda y PQRS</h3>
        <button class="help-button__close" aria-label="Cerrar">
          <svg class="icon icon--md" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="help-button__form">
        <form class="form-grid" novalidate>
          <div class="form-field"><label class="form-field__label" for="pqrs-name">Nombre completo *</label><input type="text" id="pqrs-name" name="nombre" class="form-field__input" required placeholder="Tu nombre completo"></div>
          <div class="form-field"><label class="form-field__label" for="pqrs-email">Correo electrónico *</label><input type="email" id="pqrs-email" name="correo" class="form-field__input" required placeholder="tu@correo.com"></div>
          <div class="form-field form-field--full"><label class="form-field__label" for="pqrs-message">Mensaje *</label><textarea id="pqrs-message" name="comentario" class="form-field__input" rows="5" required placeholder="Escribe tu consulta, queja, reclamo o sugerencia..."></textarea></div>
          <button type="submit" class="button button--primary button--lg button--full">Enviar PQRS</button>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    function initComparePage() {
      const params = new URLSearchParams(window.location.search);
      const items = [];

      for (const [, value] of params.entries()) {
        if (value.startsWith('{')) {
          try {
            items.push(JSON.parse(value));
          } catch (e) {
            console.error('Invalid item:', value);
          }
        }
      }

      const emptyState = document.getElementById('empty-state');
      const compareTable = document.getElementById('compare-table');
      const colHeaders = ['col-1', 'col-2', 'col-3', 'col-4'].map(id => document.getElementById(id));
      const rowsContainer = document.getElementById('compare-rows');
      const clearBtn = document.getElementById('clear-compare');

      if (items.length < 2) {
        emptyState.hidden = false;
        compareTable.hidden = true;
        return;
      }

      emptyState.hidden = true;
      compareTable.hidden = false;

      const allKeys = new Set();
      items.forEach(item => Object.keys(item).forEach(k => allKeys.add(k)));

      const priorityKeys = ['name', 'category', 'type', 'url', 'description', 'image'];
      const sortedKeys = [...allKeys].sort((a, b) => {
        const ai = priorityKeys.indexOf(a);
        const bi = priorityKeys.indexOf(b);
        if (ai !== -1 && bi !== -1) return ai - bi;
        if (ai !== -1) return -1;
        if (bi !== -1) return 1;
        return a.localeCompare(b);
      });

      colHeaders.forEach((header, i) => {
        if (items[i]) {
          header.textContent = items[i].name || 'Sin nombre';
          header.setAttribute('data-type', items[i].type || '');
        } else {
          header.textContent = '';
        }
      });

      rowsContainer.innerHTML = sortedKeys.map(key => {
        if (key === 'image') return '';
        const row = `<tr class="border-t border-border">
          <td class="p-4 font-medium text-primary">${formatKey(key)}</td>
          ${items.map(item => `<td class="p-4">${formatValue(key, item[key])}</td>`).join('')}
        </tr>`;
        return row;
      }).join('');

      clearBtn?.addEventListener('click', () => {
        localStorage.removeItem('duam-comparison');
        window.location.href = 'comparar.html';
      });
    }

    function formatKey(key) {
      const labels = {
        name: 'Nombre',
        category: 'Categoría',
        type: 'Tipo',
        url: 'Enlace',
        description: 'Descripción',
      };
      return labels[key] || key.charAt(0).toUpperCase() + key.slice(1);
    }

    function formatValue(key, value) {
      if (!value) return '<span class="text-muted">—</span>';
      if (key === 'url') return `<a href="${value}" target="_blank" rel="noopener" class="text-primary underline">Abrir</a>`;
      if (key === 'description') return `<p class="text-sm text-muted">${value}</p>`;
      return String(value);
    }

    document.addEventListener('DOMContentLoaded', initComparePage);
  </script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
